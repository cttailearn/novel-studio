<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="墨耕">
	<title>墨耕</title>
	<!-- 朱砂印面 + 纸色书页：把「墨」与「耕」收进一枚方章里。
	     图标不依赖字体，缩到 32px 仍能看清书页与印色。 -->
	<rect width="1024" height="1024" rx="192" fill="#a8392b"/>
	<rect x="54" y="54" width="916" height="916" rx="154" fill="none" stroke="#f4ecda" stroke-width="10" opacity=".55"/>
	<!-- 摊开的书：书页是留白，页脚线是耕过的垄。 -->
	<path d="M170 500c108-54 250-62 342-6l0 250c-96-50-224-46-342 8z" fill="#f4ecda"/>
	<path d="M854 500c-108-54-250-62-342-6l0 250c96-50 224-46 342 8z" fill="#f4ecda"/>
	<path d="M236 580c66-24 146-20 210 6" fill="none" stroke="#a8392b" stroke-width="18" stroke-linecap="round"/>
	<path d="M236 638c66-24 146-20 210 6" fill="none" stroke="#a8392b" stroke-width="18" stroke-linecap="round"/>
	<path d="M788 580c-66-24-146-20-210 6" fill="none" stroke="#a8392b" stroke-width="18" stroke-linecap="round"/>
	<path d="M788 638c-66-24-146-20-210 6" fill="none" stroke="#a8392b" stroke-width="18" stroke-linecap="round"/>
	<!-- 一滴墨：从上方落进书页，暗示书写；缩小后保留为一个醒目的点。 -->
	<path d="M512 236c-20 54-30 94-30 122 0 26 14 42 30 42s30-16 30-42c0-28-10-68-30-122z" fill="#f4ecda"/>
</svg>
