<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>墨耕 · AI 长章小说创作台</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<div class="desk">
			<!-- ── 顶栏 ───────────────────────────────────────────── -->
			<header class="beam">
				<div class="brand">
					<span class="seal" aria-hidden="true">墨</span>
					<div class="brand-text">
						<h1>墨耕</h1>
						<p>AI 长章小说创作台</p>
					</div>
				</div>

				<div class="beam-mid">
					<span id="project-title" class="beam-title">未选择作品</span>
					<span id="project-stats" class="beam-stats"></span>
				</div>

				<div class="beam-controls">
					<select id="model-select" title="模型"></select>
					<select id="thinking-select" title="推理档位">
						<option value="off">不思</option>
						<option value="low">略思</option>
						<option value="medium">细思</option>
						<option value="high">深思</option>
					</select>
					<button id="open-settings" class="btn btn-quiet" title="模型与供应商">设置</button>
				</div>
			</header>

			<!-- ── 左卷 ───────────────────────────────────────────── -->
			<aside class="rail">
				<section class="rail-block">
					<h2 class="rail-label"><i class="tick"></i>案上作品</h2>
					<ul id="project-list" class="project-list"></ul>
					<button id="new-project" class="ink-btn">＋ 另起一卷</button>
				</section>

				<section class="rail-block rail-grow">
					<h2 class="rail-label"><i class="tick"></i>章目</h2>
					<ol id="chapter-list" class="chapter-list"></ol>
					<p id="chapter-empty" class="rail-note">尚无章目。切到「议」让墨客拟一份大纲。</p>
				</section>
			</aside>

			<!-- ── 中稿台 ─────────────────────────────────────────── -->
			<main class="stage">
				<nav class="stage-bar">
					<div class="tabs">
						<button class="tab is-on" data-view="manuscript"><b>稿</b><span>文稿</span></button>
						<button class="tab" data-view="chat"><b>议</b><span>对议</span></button>
					</div>
					<div class="stage-actions" id="stage-actions"></div>
				</nav>

				<section id="view-manuscript" class="view is-on" aria-label="文稿"></section>

				<section id="view-chat" class="view view-chat" aria-label="对议">
					<div id="messages" class="stream"></div>
					<form id="composer" class="composer">
						<textarea
							id="input"
							rows="3"
							placeholder="交代接下来的活计：拟大纲、补设定、续写、改稿、查前后……（Enter 发送，Shift+Enter 换行）"
						></textarea>
						<div class="composer-side">
							<button id="send" type="submit" class="btn btn-ink">呈上</button>
							<button id="abort" type="button" class="btn btn-quiet hidden">止笔</button>
						</div>
					</form>
				</section>
			</main>

			<!-- ── 右案 ───────────────────────────────────────────── -->
			<aside class="desk-right">
				<nav class="bible-tabs" id="bible-tabs">
					<button class="bible-tab is-on" data-tab="characters">人物</button>
					<button class="bible-tab" data-tab="world">世观</button>
					<button class="bible-tab" data-tab="outline">大纲</button>
					<button class="bible-tab" data-tab="notes">待办</button>
				</nav>
				<div id="bible" class="bible"></div>
			</aside>
		</div>

		<dialog id="project-dialog" class="sheet">
			<form id="project-form" method="dialog">
				<h3>另起一卷</h3>
				<label>书名<input name="title" required placeholder="例如：长夜水声" /></label>
				<label>门类<input name="genre" placeholder="例如：志怪 / 悬疑 / 世情" /></label>
				<label>一句话骨相<textarea name="logline" rows="2" placeholder="一句说清核心冲突"></textarea></label>
				<label>总字数<input name="targetWords" type="number" min="0" step="10000" placeholder="300000" /></label>
				<label>行文规约<textarea name="styleGuide" rows="3" placeholder="语体、叙述节奏、忌讳……"></textarea></label>
				<div class="dialog-actions">
					<button value="cancel" class="btn btn-quiet">作罢</button>
					<button value="create" class="btn btn-ink">立卷</button>
				</div>
			</form>
		</dialog>

		<dialog id="settings-dialog" class="sheet sheet-wide settings-dialog">
			<div class="settings-head">
				<div>
					<h3>笔墨纸砚</h3>
					<p>此处所录密钥只存本机 data/credentials.json，优先于环境变量</p>
				</div>
				<button id="settings-close" class="btn btn-quiet">掩上</button>
			</div>
			<div class="settings-defaults">
				<label>常用之笔<select id="settings-default-model"></select></label>
				<label>惯用思深<select id="settings-default-thinking"></select></label>
			</div>
			<div class="settings-body">
				<ul id="settings-providers" class="settings-providers"></ul>
				<div id="settings-detail" class="settings-detail"></div>
			</div>
		</dialog>

		<script type="module" src="/app.js"></script>
	</body>
</html>
