<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<title>墨耕 · 长篇小说创作台</title>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" id="theme-color" content="#efe7d8" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#efe7d8" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14130f" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="墨耕" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script src="/theme-init.js"></script>
		<!-- 首帧骨架：CSS 还没到时，这一块保证页面不是一片空白。
		     15 秒后自动让位——宁可露出半支半旧的界面，也不让人对着死纸。 -->
		<style>
			#boot-skeleton {
				position: fixed;
				inset: 0;
				z-index: 400;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				padding: 24px;
				background: #efe7d8;
				color: #6f6a5e;
				transition: opacity 0.32s ease;
				animation: boot-give-up 0s linear 15s forwards;
			}
			@media (prefers-color-scheme: dark) {
				#boot-skeleton {
					background: #14130f;
					color: #8c8578;
				}
			}
			@keyframes boot-give-up {
				to {
					opacity: 0;
					visibility: hidden;
					pointer-events: none;
				}
			}
			#boot-skeleton.is-gone {
				opacity: 0;
				pointer-events: none;
			}
			#boot-skeleton .boot-seal {
				width: 46px;
				height: 46px;
				display: grid;
				place-items: center;
				border: 1.5px solid currentColor;
				border-radius: 6px;
				font-size: 22px;
				font-weight: 600;
				letter-spacing: 0;
			}
			#boot-skeleton .boot-word {
				margin: 0;
				font-size: 13px;
				letter-spacing: 0.34em;
				text-indent: 0.34em;
			}
			#boot-skeleton .boot-line {
				width: 92px;
				height: 2px;
				overflow: hidden;
				background: color-mix(in oklab, currentColor 22%, transparent);
			}
			#boot-skeleton .boot-line::after {
				content: "";
				display: block;
				width: 40%;
				height: 100%;
				background: currentColor;
				animation: boot-run 1.1s ease-in-out infinite;
			}
			@keyframes boot-run {
				from {
					transform: translateX(-100%);
				}
				to {
					transform: translateX(260%);
				}
			}
		</style>
		<link rel="stylesheet" href="/style.css" />
		<link rel="stylesheet" href="/views.css" />
		<link rel="stylesheet" href="/overlays.css" />
		<link rel="stylesheet" href="/account.css" />
		<!-- 浏览器本地模式要把同一份数据层跑在页面里：importmap 是 pi-ai 的入口。 -->
		<script type="importmap">
			{
				"imports": {
					"@earendil-works/pi-ai": "/browser/vendor/pi-ai/shim.js",
					"@earendil-works/pi-ai/": "/browser/vendor/pi-ai/",
					"@earendil-works/pi-agent-core": "/browser/vendor/pi-agent-core/shim.js",
					"@earendil-works/pi-agent-core/": "/browser/vendor/pi-agent-core/",
					"zod": "/browser/vendor/zod/shim.js"
				}
			}
		</script>
	</head>
	<body>

			<div class="boot-line"></div>
		</div>

		<div id="app" class="app" data-view="desk" data-mounted="0">
			<!-- 书脊：整本书的一根脊，窄到只剩名字与几个入口 -->
			<aside id="spine" class="spine" aria-label="书脊">
				<button id="spine-brand" class="spine-seal" type="button" title="回到案头">
					<span>墨</span>
				</button>
				<button id="spine-title" class="spine-title" type="button" title="回案头" hidden></button>
				<div class="spine-rail">
					<button id="nav-desk" class="spine-btn" type="button" data-nav="desk" title="案头">
						<svg class="ico"><use href="#i-grid" /></svg>
					</button>
					<button id="nav-paper" class="spine-btn" type="button" data-nav="paper" title="稿纸">
						<svg class="ico"><use href="#i-quill" /></svg>
					</button>
					<button id="nav-materials" class="spine-btn" type="button" data-nav="materials" title="素材">
						<svg class="ico"><use href="#i-layers" /></svg>
					</button>
					<button id="nav-outline" class="spine-btn" type="button" data-nav="outline" title="大纲">
						<svg class="ico"><use href="#i-list" /></svg>
					</button>
					<button id="nav-library" class="spine-btn" type="button" data-nav="library" title="书库">
						<svg class="ico"><use href="#i-book-open" /></svg>
					</button>
				</div>
			</aside>

			<div class="app-main">
				<header id="topbar" class="topbar">
					<div class="topbar-left">
						<button id="btn-back" class="btn btn-quiet only-studio" type="button" title="回案头 (Esc)">
							<svg class="ico"><use href="#i-arrow-left" /></svg>
						</button>
						<div id="crumb" class="crumb">
							<span id="crumb-book" class="crumb-book">案头</span>
							<span class="crumb-sep" aria-hidden="true">/</span>
							<span id="crumb-chapter" class="crumb-chapter" hidden></span>
							<span id="crumb-tag" class="crumb-tag" hidden>改编</span>
						</div>
					</div>
					<div class="topbar-right">
						<div id="run-pill" class="run-pill" hidden>
							<span class="run-dot"></span>
							<span id="run-pill-text" class="run-pill-text">正在写</span>
							<button id="run-pill-stop" class="run-stop" type="button" title="中止这一轮">
								<svg class="ico"><use href="#i-stop" /></svg>
							</button>
						</div>
						<span id="save-state" class="save-state" aria-live="polite"></span>
						<div id="word-badge" class="word-badge" hidden></div>
						<button id="btn-palette" class="btn btn-quiet" type="button" title="命令面板 (⌘K / Ctrl+K)">
							<svg class="ico"><use href="#i-search" /></svg>
							<span class="btn-hint">K</span>
						</button>
						<button id="btn-theme" class="btn btn-quiet" type="button" title="切换昼夜 (t)">
							<svg class="ico theme-glyph"><use href="#i-moon" /></svg>
						</button>
						<button id="btn-settings" class="btn btn-quiet" type="button" title="设置">
							<svg class="ico"><use href="#i-sliders" /></svg>
						</button>
						<button id="account-btn" class="btn btn-quiet" type="button" title="账号" hidden>
							<svg class="ico"><use href="#i-user" /></svg>
						</button>
					</div>
				</header>

				<main id="stage" class="stage">
					<!-- 案头 -->
					<section id="view-desk" class="view view-desk is-active" aria-label="案头">
						<div id="desk-scroll" class="desk-scroll">
							<header class="desk-head">
								<div class="desk-head-text">
									<p class="eyebrow">案头</p>
									<h1 id="desk-title" class="desk-title">铺开纸，写第一句</h1>
									<p id="desk-sub" class="desk-sub">本地优先的长篇小说创作台。书稿留在你自己的机器上。</p>
								</div>
								<div class="desk-head-actions">
									<button id="btn-new-project" class="btn btn-ink" type="button">
										<svg class="ico"><use href="#i-plus" /></svg>新书
									</button>
								</div>
							</header>
							<div id="desk-notice"></div>
							<section class="desk-block">
								<div class="block-head">
									<h2 class="block-title">书稿</h2>
									<span id="desk-count" class="block-count"></span>
								</div>
								<div id="project-grid" class="project-grid"></div>
								<div id="desk-empty" class="empty-state" hidden>
									<div class="empty-seal">墨</div>
									<p class="empty-title">案头还空着</p>
									<p class="empty-note">立一本新书，或者先翻一本样书看看这个台子怎么用。</p>
									<div class="empty-actions">
										<button class="btn btn-ink" type="button" data-act="new-project">立一本新书</button>
										<button class="btn btn-ghost" type="button" data-act="sample-project">摊开一本样书</button>
									</div>
								</div>
							</section>
							<section class="desk-block" id="library-block">
								<div class="block-head">
									<h2 class="block-title">通用素材库</h2>
									<span id="library-count" class="block-count"></span>
									<div class="block-tools">
										<div class="search-mini">
											<svg class="ico"><use href="#i-search" /></svg>
											<input id="library-search" type="search" placeholder="搜素材" autocomplete="off" />
										</div>
										<button id="btn-new-library" class="btn btn-ghost btn-sm" type="button">
											<svg class="ico"><use href="#i-plus" /></svg>新素材
										</button>
									</div>
								</div>
								<p class="block-note">跨作品可复用的料。立新书或给某章装料时可以把它们取进来，取的是复制。</p>
								<div id="library-grid" class="lib-grid"></div>
								<div id="library-empty" class="empty-inline" hidden>库里还没有可复用的素材。</div>
							</section>
							<section class="desk-block" id="source-block">
								<div class="block-head">
									<h2 class="block-title">原料库</h2>
									<span id="source-count" class="block-count"></span>
									<div class="block-tools">
										<button id="btn-ingest-source" class="btn btn-ghost btn-sm" type="button">
											<svg class="ico"><use href="#i-upload" /></svg>导入原书
										</button>
									</div>
								</div>
								<p class="block-note">整本原书或资料，切成章节留着给改编台与考据用。</p>
								<div id="source-list" class="source-list"></div>
								<div id="source-empty" class="empty-inline" hidden>还没有导入任何原料。</div>
							</section>
							<section class="desk-block" id="trash-block" hidden>
								<div class="block-head">
									<h2 class="block-title">废纸篓</h2>
									<button class="btn btn-quiet btn-sm" type="button" data-act="toggle-trash">收起</button>
								</div>
								<div id="trash-list" class="trash-list"></div>
							</section>
						</div>
					</section>

					<!-- 写作台 -->
					<section id="view-studio" class="view view-studio" aria-label="写作台">
						<aside id="rail" class="rail" aria-label="章目">
							<div class="rail-head">
								<div class="ring-wrap" id="ring-wrap">
									<svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
										<circle class="ring-track" cx="22" cy="22" r="18.5" />
										<circle id="ring-value" class="ring-value" cx="22" cy="22" r="18.5" />
									</svg>
									<span id="ring-pct" class="ring-pct">0%</span>
								</div>
								<div class="rail-head-text">
									<p class="eyebrow">全书</p>
									<p id="rail-stat" class="rail-stat">0 字</p>
								</div>
								<button id="btn-rail-filter" class="btn btn-quiet btn-icon" type="button" title="只看没写完的">
									<svg class="ico"><use href="#i-sort" /></svg>
								</button>
							</div>
							<div class="rail-tools">
								<label class="search-mini" for="rail-search">
									<svg class="ico"><use href="#i-search" /></svg>
									<input id="rail-search" type="search" placeholder="找章" autocomplete="off" spellcheck="false" />
								</label>
								<button id="btn-add-chapter" class="btn btn-quiet btn-icon" type="button" title="添一章">
									<svg class="ico"><use href="#i-plus" /></svg>
								</button>
							</div>
							<div id="rail-list" class="rail-list"></div>
							<div class="rail-foot">
								<button id="btn-open-dock" class="btn btn-quiet rail-foot-btn" type="button" title="副驾（跟执笔者说话）">
									<svg class="ico"><use href="#i-spark" /></svg>副驾
								</button>
								<button id="btn-history" class="btn btn-quiet rail-foot-btn" type="button" title="版本与记录">
									<svg class="ico"><use href="#i-history" /></svg>履历
								</button>
							</div>
						</aside>

						<div class="paper-shell">
							<div class="paper-bar">
								<button id="btn-open-rail" class="btn btn-quiet btn-icon only-narrow" type="button" title="章目">
									<svg class="ico"><use href="#i-list" /></svg>
								</button>
								<div class="paper-tabs" role="tablist">
									<button class="tab is-active" type="button" data-tab="paper" role="tab">稿</button>
									<button class="tab" type="button" data-tab="materials" role="tab">料</button>
									<button class="tab" type="button" data-tab="outline" role="tab">纲</button>
								</div>
								<div id="paper-actions" class="paper-actions"></div>
								<button id="btn-focus" class="btn btn-quiet btn-icon" type="button" title="专注模式 (F)">
									<svg class="ico"><use href="#i-focus" /></svg>
								</button>
							</div>

							<div class="paper-body">
								<section id="view-manuscript" class="pane pane-manuscript is-active">
									<div id="ms-scroll" class="ms-scroll">
										<div id="ms-page" class="ms-page">
											<div id="ms-placeholder" class="ms-placeholder" hidden></div>
											<div id="ms-empty" class="ms-empty" hidden></div>
											<label class="ms-chapter-line" for="ms-title">
												<span id="ms-ordinal" class="ms-ordinal"></span>
												<input id="ms-title" class="ms-title-input" type="text" placeholder="这一章叫什么" autocomplete="off" spellcheck="false" />
											</label>
											<div id="ms-meta" class="ms-meta"></div>
											<textarea id="ms-body" class="ms-body" spellcheck="false" placeholder="从这里落下第一句。写不动的时候，叫副驾过来替你探路。"></textarea>
											<div id="ms-foot" class="ms-foot"></div>
										</div>
									</div>
								</section>

								<section id="view-materials" class="pane pane-materials">
									<div id="mat-scroll" class="mat-scroll"></div>
								</section>

								<section id="view-outline" class="pane pane-outline">
									<div id="outline-scroll" class="outline-scroll"></div>
								</section>
							</div>
						</div>

						<aside id="dock" class="dock" aria-label="副驾">
							<div class="dock-head">
								<div class="dock-role" id="dock-roles">
									<button class="chip is-active" type="button" data-role="writing" title="执笔者：这一章怎么写">
										<svg class="ico"><use href="#i-quill" /></svg>执笔者
									</button>
									<button class="chip" type="button" data-role="material" title="设定官：料够不够、合不合">
										<svg class="ico"><use href="#i-feather" /></svg>设定官
									</button>
									<button class="chip" type="button" data-role="polish" title="润色：逐句挑毛病">
										<svg class="ico"><use href="#i-wand" /></svg>润色
									</button>
								</div>
								<div class="dock-head-tools">
									<button id="btn-dock-new" class="btn btn-quiet btn-icon" type="button" title="换一席新会话">
										<svg class="ico"><use href="#i-refresh" /></svg>
									</button>
									<button id="btn-close-dock" class="btn btn-quiet btn-icon only-compact" type="button" title="收起">
										<svg class="ico"><use href="#i-x" /></svg>
									</button>
								</div>
							</div>
							<div id="dock-stream" class="dock-stream"></div>
							<div id="dock-compose" class="dock-compose">
								<div id="dock-attach" class="dock-attach"></div>
								<div class="compose-box">
									<textarea id="dock-input" class="compose-input" rows="1" placeholder="跟执笔者说这一章怎么走…（Enter 发送，Shift+Enter 换行）" spellcheck="false"></textarea>
									<div class="compose-foot">
										<button id="btn-dock-model" class="btn btn-quiet btn-sm" type="button" title="换模型">
											<span id="dock-model-label">模型</span>
											<svg class="ico"><use href="#i-chevron-down" /></svg>
										</button>
										<button id="btn-dock-send" class="btn btn-ink btn-send" type="button" title="发送 (Enter)">
											<svg class="ico"><use href="#i-arrow-right" /></svg>
										</button>
									</div>
								</div>
								<div id="dock-quick" class="dock-quick"></div>
							</div>
						</aside>
					</section>

					<!-- 改编台 -->
					<section id="view-adapt" class="view view-adapt" aria-label="改编台">
						<div id="adapt-root" class="adapt-root"></div>
					</section>
				</main>
			</div>

			<!-- 遮罩放在 #app 里：浮层（章目、副驾、履历）都是它的兄弟，
			     否则 fixed 定位的 #app 会另起一层叠放，遮罩反而盖在抽屉上。 -->
			<div id="scrim" class="scrim" hidden></div>
			<nav id="mobile-nav" class="mobile-nav" aria-label="主导航">
				<button class="mnav" type="button" data-nav="desk">
					<svg class="ico"><use href="#i-grid" /></svg><span>案头</span>
				</button>
				<button class="mnav" type="button" data-nav="paper">
					<svg class="ico"><use href="#i-quill" /></svg><span>稿纸</span>
				</button>
				<button class="mnav" type="button" data-nav="materials">
					<svg class="ico"><use href="#i-layers" /></svg><span>素材</span>
				</button>
				<button class="mnav" type="button" data-nav="outline">
					<svg class="ico"><use href="#i-list" /></svg><span>大纲</span>
				</button>
				<button class="mnav" type="button" data-nav="dock">
					<svg class="ico"><use href="#i-spark" /></svg><span>副驾</span>
				</button>
			</nav>
		</div>

		<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

		<!-- 通用弹窗：内容由 app 渲染，避免每个面板各写一套骨架 -->
		<dialog id="modal" class="modal">
			<form id="modal-form" class="modal-card" method="dialog" novalidate>
				<header class="modal-head">
					<p id="modal-eyebrow" class="eyebrow"></p>
					<h2 id="modal-title" class="modal-title"></h2>
					<button id="modal-close" class="btn btn-quiet btn-icon" type="button" title="关闭 (Esc)">
						<svg class="ico"><use href="#i-x" /></svg>
					</button>
				</header>
				<div id="modal-body" class="modal-body"></div>
				<footer id="modal-foot" class="modal-foot"></footer>
			</form>
		</dialog>

		<!-- 命令面板 -->
		<div id="palette" class="palette" hidden>
			<div class="palette-card" role="dialog" aria-label="命令面板">
				<div class="palette-input-row">
					<svg class="ico"><use href="#i-search" /></svg>
					<input id="palette-input" type="text" placeholder="去哪儿？做什么？" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" />
					<kbd class="kbd">Esc</kbd>
				</div>
				<div id="palette-list" class="palette-list" role="listbox" aria-label="命令"></div>
				<div class="palette-foot">
					<span><kbd class="kbd">↑↓</kbd> 选</span>
					<span><kbd class="kbd">Enter</kbd> 走</span>
					<span id="palette-hint" class="palette-hint"></span>
				</div>
			</div>
		</div>

		<!-- 隐藏的文件入口：全部由按钮代点 -->
		<input id="library-file-input" type="file" hidden accept=".txt,.md,.markdown,.json,.csv" />
		<input id="material-file-input" type="file" hidden accept=".txt,.md,.markdown,.docx" />
		<input id="source-file-input" type="file" hidden accept=".txt,.md,.markdown,.epub,.docx,.pdf" />
		<input id="novel-file-input" type="file" hidden accept=".novel" />

		<!-- 右侧抽屉：履历 / 记录 / 快照 -->
		<aside id="drawer" class="drawer" hidden aria-label="履历">
			<header class="drawer-head">
				<p id="drawer-eyebrow" class="eyebrow"></p>
				<h2 id="drawer-title" class="drawer-title">履历</h2>
				<button id="drawer-close" class="btn btn-quiet btn-icon" type="button" title="关闭 (Esc)">
					<svg class="ico"><use href="#i-x" /></svg>
				</button>
			</header>
			<div id="drawer-body" class="drawer-body"></div>
			<footer id="drawer-foot" class="drawer-foot"></footer>
		</aside>

		<!-- 设置：update.js 依赖 #settings-about-panel 与 #settings-update-nav-dot -->
		<dialog id="settings" class="settings" aria-label="设置">
			<div class="settings-card">
				<nav class="settings-nav">
					<div class="settings-nav-head">
						<div class="seal-mini">墨</div>
						<div>
							<p class="settings-nav-title">设置</p>
							<p class="settings-nav-sub" id="settings-mode-line"></p>
						</div>
					</div>
					<div id="settings-nav-list" class="settings-nav-list">
						<button class="settings-nav-item is-active" type="button" data-panel="model" id="settings-nav-model">
							<svg class="ico"><use href="#i-spark" /></svg>模型
						</button>
						<button class="settings-nav-item" type="button" data-panel="prefs" id="settings-nav-prefs">
							<svg class="ico"><use href="#i-sliders" /></svg>偏好
						</button>
						<button class="settings-nav-item" type="button" data-panel="data" id="settings-nav-data">
							<svg class="ico"><use href="#i-folder" /></svg>数据
						</button>
						<button class="settings-nav-item" type="button" data-panel="about" id="settings-nav-about">
							<svg class="ico"><use href="#i-info" /></svg>关于
							<span id="settings-update-nav-dot" class="settings-nav-dot" hidden></span>
						</button>
					</div>
					<div class="settings-nav-foot">
						<button id="settings-close" class="btn btn-ghost btn-sm" type="button">收起</button>
					</div>
				</nav>
				<div id="settings-panels" class="settings-panels">
					<section class="settings-panel is-active" data-panel="model" id="settings-panel-model"></section>
					<section class="settings-panel" data-panel="prefs" id="settings-panel-prefs"></section>
					<section class="settings-panel" data-panel="data" id="settings-panel-data"></section>
					<section class="settings-panel" data-panel="about" id="settings-panel-about">
						<div id="settings-about-panel" class="settings-about-panel"></div>
					</section>
				</div>
			</div>
		</dialog>

		<script src="/boot.js"></script>
		<script type="module" src="/app.js"></script>
	</body>
</html>
