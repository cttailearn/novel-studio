<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Novel Studio">
  <defs>
    <linearGradient id="ns-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d6ef2"/>
      <stop offset="1" stop-color="#3f8fd6"/>
    </linearGradient>
  </defs>
  <!-- open manuscript -->
  <path d="M12 14c7-3 13-3 20 1 7-4 13-4 20-1v33c-7-3-13-3-20 1-7-4-13-4-20-1V14z"
        fill="url(#ns-cover)" opacity="0.16"/>
  <path d="M12 14c7-3 13-3 20 1 7-4 13-4 20-1v33c-7-3-13-3-20 1-7-4-13-4-20-1V14z"
        fill="none" stroke="url(#ns-cover)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M32 15v33" fill="none" stroke="url(#ns-cover)" stroke-width="2" opacity="0.75"/>
  <!-- text lines left page -->
  <g stroke="#6d6ef2" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M18 23h9"/>
    <path d="M18 29h9"/>
    <path d="M18 35h7"/>
  </g>
  <!-- the nib that turns notes into prose -->
  <path d="M38 22l7 3-2.4 8.6L38 36l-2.6-6.4L38 22z"
